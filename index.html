<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>ডেস্ক ক্যালেন্ডার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;800&family=Noto+Sans+Bengali:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#000;touch-action:none}
body{font-family:'Noto Serif Bengali','Kalpurush','Siyam Rupali',serif}
#app{position:fixed;inset:0;transition:filter .6s}
#app.dim{filter:brightness(.42) saturate(.8)}
.view{position:absolute;inset:0;display:none}
.sans{font-family:'Noto Sans Bengali','Kalpurush',sans-serif}

/* ===== shared: wood theme (v1, v2) ===== */
.v1,.v2{
  --brass:#c19a4b;--brass-d:#7d5f26;--glow:#f3dca0;--ink:#2b2117;--red:#9a2c1f;--paper2:#dccfa9;
  background:repeating-linear-gradient(92deg,rgba(255,255,255,.025) 0 2px,transparent 2px 7px),linear-gradient(#33200f,#24150c);color:var(--ink)}
.v1.on{display:grid;grid-template-columns:1fr 1.12fr;gap:3vh 3vw;padding:4vh 3vw}
.left,.rcol{display:flex;flex-direction:column;gap:2.6vh;min-height:0}
.clock{flex:1.4;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.4vh;border:.5vh solid var(--brass);border-radius:1.2vh;background:rgba(0,0,0,.32);box-shadow:inset 0 0 0 .4vh var(--brass-d),0 .8vh 2vh rgba(0,0,0,.55);min-height:0}
.period{color:var(--brass);font-size:3.6vh;letter-spacing:.1em}
.tiles{display:flex;align-items:center;gap:.6vw}
.tile{width:5.6vw;height:16vh;display:grid;place-items:center;border-radius:.9vh;font-size:12vh;line-height:1;font-weight:800;color:var(--glow);background:linear-gradient(#1f150d 50%,#140d07 50%);box-shadow:0 .5vh 1vh rgba(0,0,0,.6);position:relative}
.tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:.35vh;background:#000;opacity:.7}
.tile.s{width:4.4vw;height:11vh;font-size:8.4vh;color:var(--brass)}
.tiles .gap{width:1vw}
.colon{color:var(--brass);font-size:10vh;font-weight:800;animation:blink 2s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.weekday{color:var(--glow);font-size:4.4vh;font-weight:600}
.weather{flex:1;display:flex;align-items:center;gap:2vw;padding:1.6vh 2vw;min-height:0;border:.4vh solid var(--brass-d);border-radius:1.2vh;background:rgba(0,0,0,.28);color:var(--glow)}
.wicon{font-size:9vh;line-height:1}
.wtemp{font-size:8vh;font-weight:800;line-height:1}
.wcond{font-size:3.4vh;font-weight:600}
.wmeta{font-size:2.6vh;color:#d4c08a;line-height:1.5}
.wnote{font-size:2.1vh;color:var(--brass)}
.page{flex:1;display:flex;flex-direction:column;min-height:0;border-radius:.8vh;padding:2.2vh 2vw 1.8vh;background:linear-gradient(#f0e6ca,var(--paper2));box-shadow:0 1vh 2.4vh rgba(0,0,0,.6),inset 0 0 6vh rgba(120,90,40,.28);position:relative}
.page::before{content:"";position:absolute;top:-1.2vh;left:8%;right:8%;height:2.4vh;background:radial-gradient(circle,var(--brass) 38%,transparent 42%) 0 0/4.4vw 2.4vh repeat-x}
.head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:.35vh double var(--ink);padding-bottom:1vh}
.month{font-size:5.2vh;font-weight:800}.year{font-size:4vh;font-weight:600;color:var(--red)}
.today{display:flex;align-items:baseline;gap:1.6vw;padding:.8vh 0;font-size:3.2vh}
.today b{font-size:7.4vh;color:var(--red);line-height:1}
.calgrid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;min-height:0;font-size:var(--cf,3.5vh);text-align:center}
.calgrid div{display:grid;place-items:center}
.calgrid .dh{font-size:.8em;font-weight:800;border-bottom:.2vh solid rgba(43,33,23,.5)}
.calgrid .fri{color:var(--red)}.calgrid .off{opacity:0}
.calgrid .now{background:var(--ink);color:#eadfc2;border-radius:50%;aspect-ratio:1;height:88%;justify-self:center;font-weight:800;box-shadow:0 0 0 .4vh var(--red)}

/* ===== analog svg ===== */
.an{height:88vh;width:88vh;flex:none}
.a-classic .bez{fill:#c19a4b;stroke:#7d5f26;stroke-width:2}
.a-classic .face{fill:#efe6cb}
.a-classic .tm{stroke:#2b2117;stroke-width:2.4}.a-classic .tn{stroke:#6a5a40;stroke-width:.9}
.a-classic .num{fill:#2b2117;font-weight:800;font-size:15px}
.a-classic .hh,.a-classic .mh{stroke:#2b2117;stroke-linecap:round}
.a-classic .sh{stroke:#9a2c1f;fill:#9a2c1f}
.a-mod .face{fill:#000;stroke:#2a2a2a;stroke-width:2}
.a-mod .tm{stroke:#fff;stroke-width:3}.a-mod .tn{stroke:#666;stroke-width:1}
.a-mod .hh,.a-mod .mh{stroke:#fff;stroke-linecap:round}
.a-mod .sh{stroke:#ff7a1a;fill:#ff7a1a}
.hh line{stroke-width:6}.mh line{stroke-width:4}.sh line{stroke-width:2}

/* ===== v2: analog classic ===== */
.v2.on{display:grid;grid-template-columns:auto 1fr;gap:3vw;padding:4vh 3vw;align-items:center}
.v2 .calgrid{--cf:3vh}.v2 .today{display:none}.v2 .rcol{height:100%}
.v2 .weather{flex:.42}.v2 .wicon{font-size:6vh}.v2 .wtemp{font-size:5.4vh}.v2 .wcond{font-size:2.8vh}.v2 .wmeta{font-size:2.2vh}.v2 .wnote{display:none}

/* ===== v3: smart display ===== */
.v3{background:#e7e7e4;color:#1d1d1d}
.v3.on{display:grid;grid-template-rows:auto 1fr;gap:2.4vh;padding:4vh 4vw}
.v3 .top{display:flex;justify-content:space-between;align-items:baseline}
.v3 .tl{font-size:4.6vh;font-weight:600}.v3 .tl small{display:block;font-size:3.2vh;color:#6b6b6b;font-weight:400}
.v3 .tr{font-size:9vh;font-weight:800;line-height:1}.v3 .tr small{font-size:5vh;color:#c0392b;margin-left:1vw}
.v3 .main{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:3vw;border-top:.3vh solid #c4c4bf;padding-top:3vh;min-height:0}
.v3 .c1{display:flex;flex-direction:column;justify-content:center;gap:1vh}
.v3 .c1 .row{display:flex;align-items:center;gap:1.4vw}
.v3 .bigicon{font-size:19vh;line-height:1}.v3 .bigtemp{font-size:26vh;font-weight:600;line-height:1}
.v3 .cnd{font-size:4.4vh;color:#444}
.v3 .c2{display:flex;flex-direction:column;justify-content:center;gap:2.2vh;font-size:3.6vh;border-left:.3vh solid #c4c4bf;padding-left:2.4vw}
.v3 .c3{display:flex;flex-direction:column;justify-content:center;gap:2.6vh;border-left:.3vh solid #c4c4bf;padding-left:2.4vw}
.v3 .fr{display:flex;align-items:center;gap:1.4vw;font-size:3.6vh}
.v3 .fr .fi{font-size:6vh}.v3 .fr .fd{width:11vw;font-weight:600}.v3 .fr .fh{color:#6b6b6b}

/* ===== v4: night minimal ===== */
.v4{background:#000;color:#ffb44d}
.v4.on{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.6vh}
.v4 .row{display:flex;align-items:flex-end;gap:2vw}
.v4 .big{font-size:38vh;font-weight:600;line-height:1}
.v4 .bigs{font-size:17vh;font-weight:600;line-height:1.05;color:#ff8a3d}
.v4 .dl{font-size:6vh;color:#d8d8d8}
.v4 .wl{font-size:5vh;color:#9a9a8a}

/* ===== v5: analog modern ===== */
.v5{background:#050505;color:#eee}
.v5.on{display:grid;grid-template-columns:auto 1fr;gap:4vw;padding:5vh 4vw;align-items:center}
.v5 .rt{display:flex;flex-direction:column;gap:1.6vh}
.v5 .dn{font-size:34vh;font-weight:800;line-height:1;color:#ff7a1a}
.v5 .l1{font-size:6.4vh;font-weight:600}.v5 .l2{font-size:4.6vh;color:#aaa}.v5 .l3{font-size:4.6vh;color:#cfcfcf;margin-top:1vh}

/* ===== control bar ===== */
#bar{position:fixed;left:50%;bottom:3vh;transform:translateX(-50%);display:flex;align-items:center;gap:1.4vh;padding:1.2vh 2vh;border-radius:6vh;background:rgba(15,15,15,.82);border:.3vh solid #7d5f26;color:#f3dca0;opacity:0;pointer-events:none;transition:opacity .35s;z-index:9;font-family:'Noto Sans Bengali',sans-serif}
#bar.show{opacity:1;pointer-events:auto}
#bar button{width:7vh;height:7vh;border-radius:50%;border:.3vh solid #7d5f26;background:transparent;color:#c19a4b;font-size:3.6vh;cursor:pointer}
#bar button:active{background:#7d5f26}
#bN{min-width:22vh;text-align:center;font-size:3.2vh}
#bW{width:1.3vh;height:1.3vh;border-radius:50%;background:#666}#bW.on{background:#7fb26a}
#rot{display:none;position:fixed;inset:0;z-index:20;background:#000;color:#f3dca0;place-items:center;font-size:5vw;text-align:center;padding:8vw}
@media (orientation:portrait){#rot{display:grid}}
@media (prefers-reduced-motion:reduce){.colon{animation:none}}
</style>
</head>
<body>
<div id="app">

<section class="view v1" data-name="ক্লাসিক কাঠ">
  <div class="left">
    <div class="clock">
      <div class="period" data-k="per"></div>
      <div class="tiles">
        <div class="tile" data-k="h1"></div><div class="tile" data-k="h2"></div><span class="colon">:</span>
        <div class="tile" data-k="m1"></div><div class="tile" data-k="m2"></div><span class="gap"></span>
        <div class="tile s" data-k="s1"></div><div class="tile s" data-k="s2"></div>
      </div>
      <div class="weekday" data-k="wd"></div>
    </div>
    <div class="weather wbox"></div>
  </div>
  <div class="page pagebox"></div>
</section>

<section class="view v2 a-classic" data-name="অ্যানালগ ক্লাসিক">
  <div class="analog" data-cls="a-classic"></div>
  <div class="rcol"><div class="page pagebox"></div><div class="weather wbox"></div></div>
</section>

<section class="view v3 sans" data-name="স্মার্ট ডিসপ্লে">
  <div class="top">
    <div class="tl"><span data-k="wd"></span><small data-k="dl"></small></div>
    <div class="tr"><span data-k="hm"></span><small data-k="s"></small></div>
  </div>
  <div class="main">
    <div class="c1"><div class="row"><span class="bigicon" data-k="icon"></span><span class="bigtemp" data-k="temp"></span></div><div class="cnd"><span data-k="city"></span> · <span data-k="cond"></span></div></div>
    <div class="c2"><div data-k="feels"></div><div data-k="hum"></div><div data-k="wind"></div><div data-k="rain"></div><div data-k="hi"></div><div data-k="lo"></div></div>
    <div class="c3" id="fc"></div>
  </div>
</section>

<section class="view v4 sans" data-name="নাইট মিনিমাল">
  <div class="row"><span class="big" data-k="hm"></span><span class="bigs" data-k="s"></span></div>
  <div class="dl"><span data-k="wd"></span> · <span data-k="dl"></span></div>
  <div class="wl"><span data-k="icon"></span> <span data-k="temp"></span> · <span data-k="cond"></span> · <span data-k="hum"></span></div>
</section>

<section class="view v5 a-mod sans" data-name="অ্যানালগ আধুনিক">
  <div class="analog" data-cls="a-mod" data-mod="1"></div>
  <div class="rt">
    <div class="dn" data-k="dn"></div>
    <div class="l1"><span data-k="wd"></span></div>
    <div class="l2"><span data-k="mn"></span> <span data-k="yr"></span></div>
    <div class="l3"><span data-k="icon"></span> <span data-k="temp"></span> · <span data-k="cond"></span><br><span data-k="hum"></span></div>
  </div>
</section>

</div>

<div id="bar">
  <button id="bP" aria-label="আগের ডিজাইন">‹</button><span id="bN"></span><button id="bX" aria-label="পরের ডিজাইন">›</button>
  <button id="bD" aria-label="ডিম">☾</button><button id="bF" aria-label="ফুলস্ক্রিন">⛶</button><span id="bW" title="স্ক্রিন জাগ্রত"></span>
</div>
<div id="rot">ফোনটি আড়াআড়ি<br>(ল্যান্ডস্কেপ) করে ধরুন</div>

<script>
const $ = id => document.getElementById(id);
const BN = '০১২৩৪৫৬৭৮৯';
const bn = n => String(n).replace(/\d/g, d => BN[d]);
const pad = n => String(n).padStart(2, '0');
const MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const DAYS = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
const DSHORT = ['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি'];

/* ---- data binding: set(key, text) updates every [data-k=key] ---- */
const C = {};
const set = (k, v) => { if (C[k] === v) return; C[k] = v; document.querySelectorAll(`[data-k="${k}"]`).forEach(e => e.textContent = v); };

/* ---- templates ---- */
const WBOX = `<div class="wicon" data-k="icon"></div>
<div><div class="wtemp" data-k="temp"></div><div class="wcond">ঢাকা · <span data-k="cond"></span></div></div>
<div><div class="wmeta"><span data-k="feels"></span> · <span data-k="hum"></span><br><span data-k="wind"></span><br><span data-k="hi"></span> · <span data-k="lo"></span></div><div class="wnote" data-k="upd"></div></div>`;
const PAGE = `<div class="head"><span class="month" data-k="mn"></span><span class="year" data-k="yr"></span></div>
<div class="today"><b data-k="dn"></b><span><span data-k="wd"></span>, <span data-k="mn"></span></span></div><div class="calgrid"></div>`;
document.querySelectorAll('.wbox').forEach(e => e.innerHTML = WBOX);
document.querySelectorAll('.pagebox').forEach(e => e.innerHTML = PAGE);

function analog(el){
  const mod = !!el.dataset.mod; let s = `<svg class="an ${el.dataset.cls}" viewBox="0 0 200 200">`;
  s += mod ? '<circle class="face" cx="100" cy="100" r="97"/>' : '<circle class="bez" cx="100" cy="100" r="98"/><circle class="face" cx="100" cy="100" r="90"/>';
  const R = mod ? 90 : 84;
  for (let i = 0; i < 60; i++){
    const a = i * Math.PI / 30, big = i % 5 === 0, L = big ? 9 : 4;
    s += `<line class="${big ? 'tm' : 'tn'}" x1="${100 + R * Math.sin(a)}" y1="${100 - R * Math.cos(a)}" x2="${100 + (R - L) * Math.sin(a)}" y2="${100 - (R - L) * Math.cos(a)}"/>`;
  }
  if (!mod) for (let i = 1; i <= 12; i++){
    const a = i * Math.PI / 6;
    s += `<text class="num" x="${100 + 66 * Math.sin(a)}" y="${100 - 66 * Math.cos(a)}" text-anchor="middle" dominant-baseline="central">${bn(i)}</text>`;
  }
  s += `<g class="hh"><line x1="100" y1="110" x2="100" y2="52"/></g><g class="mh"><line x1="100" y1="112" x2="100" y2="26"/></g>` +
       `<g class="sh"><line x1="100" y1="122" x2="100" y2="20"/><circle cx="100" cy="100" r="5"/></g><circle cx="100" cy="100" r="2.4" fill="#000"/></svg>`;
  el.innerHTML = s;
}
document.querySelectorAll('.analog').forEach(analog);
const rot = (cls, deg) => document.querySelectorAll('.' + cls).forEach(g => g.setAttribute('transform', `rotate(${deg} 100 100)`));

/* ---- clock + calendar ---- */
let lastDay = '', manualDim = null;
function tick(){
  const d = new Date(), h = d.getHours(), m = d.getMinutes(), s = d.getSeconds(), h12 = h % 12 || 12;
  const hh = bn(pad(h12)), mm = bn(pad(m)), ss = bn(pad(s));
  set('h1', hh[0]); set('h2', hh[1]); set('m1', mm[0]); set('m2', mm[1]); set('s1', ss[0]); set('s2', ss[1]);
  set('hm', hh + ':' + mm); set('s', ss);
  set('per', h >= 4 && h < 6 ? 'ভোর' : h >= 6 && h < 12 ? 'সকাল' : h >= 12 && h < 15 ? 'দুপুর' : h >= 15 && h < 17 ? 'বিকাল' : h >= 17 && h < 19 ? 'সন্ধ্যা' : 'রাত');
  rot('hh', (h % 12) * 30 + m * 0.5 + s / 120); rot('mh', m * 6 + s * 0.1); rot('sh', s * 6);
  const key = d.toDateString();
  if (key !== lastDay){ lastDay = key; drawDate(d); }
  $('app').classList.toggle('dim', manualDim === null ? (h >= 22 || h < 6) : manualDim);
}
function drawDate(d){
  const y = d.getFullYear(), mo = d.getMonth(), t = d.getDate();
  set('wd', DAYS[d.getDay()]); set('dn', bn(t)); set('mn', MONTHS[mo]); set('yr', bn(y)); set('dl', `${bn(t)} ${MONTHS[mo]} ${bn(y)}`);
  const first = new Date(y, mo, 1).getDay(), count = new Date(y, mo + 1, 0).getDate();
  let html = DSHORT.map((n, i) => `<div class="dh${i === 5 ? ' fri' : ''}">${n}</div>`).join('');
  for (let i = 0; i < first; i++) html += '<div class="off">·</div>';
  for (let day = 1; day <= count; day++){
    const wd = (first + day - 1) % 7;
    html += `<div class="${day === t ? 'now' : wd === 5 ? 'fri' : ''}">${bn(day)}</div>`;
  }
  document.querySelectorAll('.calgrid').forEach(g => g.innerHTML = html);
}

/* ---- weather (Open-Meteo, Dhaka) ---- */
const WX = c => c === 0 ? ['পরিষ্কার আকাশ','☀️'] : c <= 2 ? ['আংশিক মেঘলা','⛅'] : c === 3 ? ['মেঘলা','☁️'] : (c === 45 || c === 48) ? ['কুয়াশা','🌫️'] :
  (c >= 51 && c <= 57) ? ['গুঁড়িগুঁড়ি বৃষ্টি','🌦️'] : (c >= 61 && c <= 67) ? ['বৃষ্টি','🌧️'] : (c >= 71 && c <= 77) ? ['তুষারপাত','❄️'] :
  (c >= 80 && c <= 82) ? ['ঝমঝম বৃষ্টি','🌧️'] : c >= 95 ? ['বজ্রসহ বৃষ্টি','⛈️'] : ['অজানা','🌡️'];
const URL_WX = 'https://api.open-meteo.com/v1/forecast?latitude=23.8103&longitude=90.4125' +
  '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day' +
  '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=4&timezone=auto';
const dg = n => bn(Math.round(n)) + '°';

function showWeather(w, stale){
  const c = w.current, D = w.daily;
  let [txt, icon] = WX(c.weather_code);
  if (c.weather_code === 0 && !c.is_day) icon = '🌙';
  set('icon', icon); set('temp', dg(c.temperature_2m)); set('cond', txt); set('city', 'ঢাকা');
  set('feels', 'অনুভূত ' + dg(c.apparent_temperature)); set('hum', 'আর্দ্রতা ' + bn(c.relative_humidity_2m) + '%');
  set('wind', 'বাতাস ' + bn(Math.round(c.wind_speed_10m)) + ' কিমি/ঘণ্টা');
  set('rain', 'বৃষ্টির সম্ভাবনা ' + bn(D.precipitation_probability_max[0] ?? 0) + '%');
  set('hi', 'সর্বোচ্চ ' + dg(D.temperature_2m_max[0])); set('lo', 'সর্বনিম্ন ' + dg(D.temperature_2m_min[0]));
  const t = new Date(w.savedAt || Date.now());
  set('upd', (stale ? 'ইন্টারনেট নেই, শেষ তথ্য: ' : 'হালনাগাদ: ') + bn(pad(t.getHours())) + ':' + bn(pad(t.getMinutes())));
  let f = '';
  for (let i = 1; i < D.time.length; i++){
    f += `<div class="fr"><span class="fd">${DSHORT[new Date(D.time[i] + 'T00:00:00').getDay()]}</span><span class="fi">${WX(D.weather_code[i])[1]}</span>` +
         `<span>${dg(D.temperature_2m_max[i])}</span><span class="fh">${dg(D.temperature_2m_min[i])}</span></div>`;
  }
  $('fc').innerHTML = f;
}
async function loadWeather(){
  try{
    const r = await fetch(URL_WX); if (!r.ok) throw 0;
    const w = await r.json(); w.savedAt = Date.now();
    try { localStorage.setItem('wx2', JSON.stringify(w)); } catch (e) {}
    showWeather(w, false);
  }catch(e){
    let w = null; try { w = JSON.parse(localStorage.getItem('wx2')); } catch (e2) {}
    if (w) showWeather(w, true); else set('cond', 'ওয়েদার পাওয়া যায়নি');
  }
}

/* ---- keep awake ---- */
let wl = null;
async function keepAwake(){
  try{
    if ('wakeLock' in navigator){
      wl = await navigator.wakeLock.request('screen'); $('bW').classList.add('on');
      wl.addEventListener('release', () => $('bW').classList.remove('on'));
    }
  }catch(e){ $('bW').classList.remove('on'); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

/* ---- designs, fullscreen, controls ---- */
const views = [...document.querySelectorAll('.view')];
let cur = 0, autoFs = false, hideT;
try { cur = Math.min(+localStorage.getItem('view') || 0, views.length - 1); } catch (e) {}
function go(n){
  cur = (n + views.length) % views.length;
  views.forEach((v, i) => v.classList.toggle('on', i === cur));
  $('bN').textContent = bn(cur + 1) + '/' + bn(views.length) + ' ' + views[cur].dataset.name;
  try { localStorage.setItem('view', cur); } catch (e) {}
}
function fs(){
  const el = document.documentElement;
  if (document.fullscreenElement){ document.exitFullscreen(); return; }
  if (el.requestFullscreen) el.requestFullscreen({ navigationUI: 'hide' }).then(() => {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
  }).catch(() => {});
}
function showBar(){ $('bar').classList.add('show'); clearTimeout(hideT); hideT = setTimeout(() => $('bar').classList.remove('show'), 4500); }
$('bP').onclick = () => { go(cur - 1); showBar(); };
$('bX').onclick = () => { go(cur + 1); showBar(); };
$('bD').onclick = () => { manualDim = !$('app').classList.contains('dim'); tick(); showBar(); };
$('bF').onclick = () => { fs(); keepAwake(); showBar(); };

let sx = 0, sy = 0;
document.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
document.addEventListener('pointerup', e => {
  if (e.target.closest('#bar')) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dy) < 60){ go(cur + (dx < 0 ? 1 : -1)); showBar(); }
  else if (Math.abs(dx) < 14 && Math.abs(dy) < 14){
    if (!autoFs){ autoFs = true; if (!document.fullscreenElement) fs(); }
    keepAwake(); showBar();
  }
});

go(cur); tick(); setInterval(tick, 1000);
loadWeather(); setInterval(loadWeather, 15 * 60 * 1000);
keepAwake();
</script>
